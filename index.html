<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHILIJEWS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: url('racist.gif') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      overflow: hidden;
      position: relative;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      position: relative;
      z-index: 100;
      font-size: 48px; /* Increase font size if desired */
    }

    .cokeman {
      position: absolute;
      width: 150px; /* Increased size */
      height: auto;
    }
  </style>
</head>
<body>
  <h1>HEIL ENJEW</h1>

  <script>
    // Function to move an image to a new random position with a random duration.
    function moveImage(img) {
      const vw = window.innerWidth - img.offsetWidth;
      const vh = window.innerHeight - img.offsetHeight;
      const newX = Math.random() * vw;
      const newY = Math.random() * vh;
      const duration = Math.random() * 3 + 2; // Duration between 2 and 5 seconds

      // Smooth movement using CSS transitions.
      img.style.transition = `left ${duration}s linear, top ${duration}s linear`;
      img.style.left = newX + 'px';
      img.style.top = newY + 'px';

      // Schedule the next move.
      setTimeout(() => moveImage(img), duration * 1000);
    }

    // Function to create and animate a flying cokeman image.
    function createFlyingCokeman() {
      const img = document.createElement('img');
      img.src = 'cokeman.gif'; // Use the gif as requested.
      img.className = 'cokeman';

      // Set an initial random position.
      const vw = window.innerWidth - img.offsetWidth;
      const vh = window.innerHeight - img.offsetHeight;
      img.style.left = Math.random() * vw + 'px';
      img.style.top = Math.random() * vh + 'px';

      document.body.appendChild(img);
      moveImage(img);
    }

    // Create a larger number of flying images.
    const numberOfCokemans = 15; // Adjust this number as desired.
    for (let i = 0; i < numberOfCokemans; i++) {
      createFlyingCokeman();
    }
  </script>
</body>
</html>
